services:
  edge:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - website
      - api
    restart: unless-stopped
  website:
    build: ./website
    environment:
      MONGO_URI: mongodb://admin:${MONGO_PASSWORD}@mongo:27017/kwiz
    deploy:
      replicas: 2
  api:
    build: ./api
    deploy:
      replicas: 2
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - ./mongo:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}